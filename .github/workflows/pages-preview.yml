name: Deploy branch preview to GitHub Pages

# Publishes THIS branch only — never main/default. Triggered by pushes to
# claude/aroma-bakery-redesign-e9nj05, or manually via the Actions tab.
# Requires a one-time repo setting (can't be done from a workflow file):
#   Settings -> Pages -> Build and deployment -> Source -> "GitHub Actions"

on:
  push:
    branches:
      - claude/aroma-bakery-redesign-e9nj05
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (repo root — static HTML/CSS/JS, no build step)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
